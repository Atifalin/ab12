server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    types { application/manifest+json webmanifest; }
    include /etc/nginx/mime.types;

    # Gzip compression for fast mobile & tablet loading
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Vite-hashed assets: filenames are content-addressed — cache forever
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Dynamic studio manifests: never cached, must 404 (not fall back to index.html)
    location ~ ^/(audio/voices/manifest|family/family|pics/pics|puzzles/puzzles|recipes/recipes)\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # SEO crawlers: serve robots.txt and sitemap.xml directly
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # voice clips + images + icons: content is stable per filename — cache hard
    location ~* \.(m4a|svg|webmanifest|png|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # app shell + code: always revalidate so every deploy lands instantly
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
