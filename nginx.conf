server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    types { application/manifest+json webmanifest; }
    include /etc/nginx/mime.types;

    # Vite-hashed assets: filenames are content-addressed — cache forever
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # family-voice manifest: never cached, must 404 (not fall back to index.html)
    location = /audio/voices/manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # family manifest: never cached, must 404 (not fall back to index.html)
    location = /family/family.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # voice clips + images + icons: content is stable per filename — cache hard
    location ~* \.(m4a|svg|webmanifest|png|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # app shell + code: always revalidate so every deploy lands instantly
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
