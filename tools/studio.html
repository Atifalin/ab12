<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AB12 Studio</title>
<style>
  :root { --ink: #2b1b3d; --font: 'Fredoka','Nunito','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; font-family:var(--font); color:var(--ink);
         background: linear-gradient(160deg,#3aa7ff,#8fd8ff 55%,#c9ffe9); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 2vmin 3vmin 6vmin; }
  h1 { text-align:center; color:#fff; font-size:6vmin; text-shadow:0 .5vmin 0 rgba(0,0,0,.2); margin:1vmin 0 2vmin; }
  .top-tabs { display:flex; gap:1.5vmin; justify-content:center; margin-bottom:2.5vmin; }
  .top-tab { font:inherit; border:0; border-radius:3vmin; padding:1.6vmin 5vmin; font-size:4vmin;
             background:rgba(255,255,255,.35); color:var(--ink); cursor:pointer; }
  .top-tab.on { background:#ff5c8a; color:#fff; }
  .tabs { display:flex; gap:1.5vmin; justify-content:center; margin-bottom:1vmin; flex-wrap:wrap; }
  .tab { font:inherit; border:0; border-radius:3vmin; padding:1.4vmin 4vmin; font-size:3.4vmin;
         background:rgba(255,255,255,.35); color:var(--ink); cursor:pointer; }
  .tab.on { background:#8a63ff; color:#fff; }
  .pack-tools { display:flex; gap:1.5vmin; justify-content:center; margin-bottom:2vmin; min-height:4vmin; }
  .pack-tools button { font:inherit; border:0; border-radius:2vmin; padding:.8vmin 2.4vmin; font-size:2.6vmin;
                       background:rgba(255,255,255,.45); color:var(--ink); cursor:pointer; }
  .chips { display:flex; flex-wrap:wrap; gap:1vmin; justify-content:center; margin-bottom:2vmin; }
  .chip { font:inherit; border:0; border-radius:2vmin; padding:1vmin 2vmin; font-size:2.6vmin;
          background:rgba(255,255,255,.5); cursor:pointer; }
  .chip.on { background:#ff5c8a; color:#fff; }
  .chip small { opacity:.75; margin-left:.6vmin; }
  .card { background:rgba(255,255,255,.92); border-radius:4vmin; padding:3vmin; text-align:center;
          box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.15); }
  .prompt { font-size:4.6vmin; font-weight:700; margin:1vmin 0 .5vmin; min-height:6vmin; }
  .sub { font-size:2.6vmin; opacity:.7; min-height:3.5vmin; }
  .key-name { font-size:2.2vmin; opacity:.5; }
  .nav { display:flex; gap:1.5vmin; justify-content:center; margin:2vmin 0; flex-wrap:wrap; }
  .nav button { font:inherit; border:0; border-radius:2.4vmin; padding:1.4vmin 3vmin; font-size:3vmin;
                background:#e3e0f2; color:var(--ink); cursor:pointer; }
  .nav button.primary { background:#8a63ff; color:#fff; }
  .rec-row { display:flex; align-items:center; justify-content:center; gap:2.5vmin; margin:2vmin 0; }
  #rec-btn { width:16vmin; height:16vmin; min-width:80px; min-height:80px; border-radius:50%; border:0; cursor:pointer;
             font-size:7vmin; background:#ff5c8a; color:#fff; box-shadow:0 1vmin 0 rgba(0,0,0,.2);
             transition:transform .1s; }
  #rec-btn:active { transform:scale(.92); }
  #rec-btn.rec { background:#e63946; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.07); } }
  #timer { font-size:4vmin; min-width:14vmin; color:var(--ink); }
  .takes { margin-top:2vmin; text-align:left; }
  .takes h3 { margin:.5vmin 0 1vmin; font-size:3vmin; }
  .take { display:flex; align-items:center; gap:1.5vmin; background:rgba(255,255,255,.6);
          border-radius:2vmin; padding:1vmin 2vmin; margin-bottom:1vmin; font-size:2.6vmin; }
  .take .fname { flex:1; opacity:.75; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .take button { font:inherit; border:0; border-radius:1.6vmin; padding:.8vmin 2vmin; cursor:pointer; font-size:2.6vmin; }
  .take .play { background:#4cd964; color:#fff; }
  .take .play.playing { background:#e63946; }
  .take .del { background:#ff6b6b; color:#fff; }
  .post { display:flex; gap:1.5vmin; justify-content:center; margin:1.5vmin 0; flex-wrap:wrap; }
  .post button { font:inherit; border:0; border-radius:2.4vmin; padding:1.4vmin 3.4vmin; font-size:3.2vmin; cursor:pointer; }
  #save-btn { background:#4cd964; color:#fff; }
  #redo-btn { background:#e3e0f2; }
  #play-btn { background:#2fb8ff; color:#fff; }
  #play-btn.playing { background:#e63946; }
  #status { text-align:center; font-size:2.8vmin; min-height:4vmin; color:#7a1f3d; }
  .overall { text-align:center; font-size:2.8vmin; color:#fff; text-shadow:0 .3vmin 0 rgba(0,0,0,.2); margin-bottom:2vmin; }
  .hintline { text-align:center; font-size:2.4vmin; color:rgba(255,255,255,.9); margin-top:2vmin; }

  /* family */
  #fam-grid { display:flex; flex-wrap:wrap; gap:2vmin; justify-content:center; margin-bottom:2vmin; }
  .mem-card { font:inherit; border:0; cursor:pointer; background:rgba(255,255,255,.92); border-radius:3vmin;
              padding:2vmin; width:22vmin; min-width:120px; display:flex; flex-direction:column; align-items:center;
              gap:1vmin; box-shadow:0 .8vmin 2vmin rgba(0,0,0,.12); }
  .mem-card.on { outline:.6vmin solid #8a63ff; }
  .mem-card img, .mem-avatar { width:14vmin; height:14vmin; min-width:64px; min-height:64px; border-radius:50%;
              object-fit:cover; background:#8a63ff; color:#fff; display:flex; align-items:center;
              justify-content:center; font-size:7vmin; }
  .mem-card .mname { font-size:3vmin; }
  .mem-card .mtitle { font-size:2.2vmin; opacity:.6; }
  .mem-card.add { background:rgba(255,255,255,.5); border:.5vmin dashed rgba(255,255,255,.9); font-size:2.6vmin; }
  #fam-edit { background:rgba(255,255,255,.92); border-radius:3vmin; padding:2.5vmin; margin-bottom:2vmin;
              display:flex; flex-direction:column; gap:1.5vmin; align-items:center; }
  #fam-edit input[type=text] { font:inherit; font-size:3vmin; padding:1vmin 2vmin; border-radius:2vmin;
              border:.3vmin solid #cfcbe0; width:min(60vmin,80%); }
  #fam-edit .imgprev { width:12vmin; height:12vmin; border-radius:50%; object-fit:cover; background:#e3e0f2; }
  #fam-edit .row { display:flex; gap:1.5vmin; flex-wrap:wrap; justify-content:center; }
  #fam-edit button { font:inherit; border:0; border-radius:2vmin; padding:1.2vmin 3vmin; font-size:2.8vmin; cursor:pointer; }
  .fam-lines { display:flex; flex-wrap:wrap; gap:1vmin; justify-content:center; margin-bottom:2vmin; }
  @media (orientation:portrait) {
    .prompt { font-size:6.5vw; } .sub { font-size:4vw; }
    .chip { font-size:3.6vw; } .nav button { font-size:4.2vw; }
    .post button { font-size:4.4vw; } #timer { font-size:6vw; }
    .tab { font-size:4.6vw; } .top-tab { font-size:5vw; }
    .mem-card { width:34vw; } .mem-card .mname { font-size:4.4vw; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎛️ AB12 Studio</h1>
  <div class="top-tabs">
    <button class="top-tab on" data-view="voices">🎙️ Voices</button>
    <button class="top-tab" data-view="family">💛 Family</button>
  </div>

  <div id="voices-pane">
    <div class="tabs" id="tabs"></div>
    <div class="pack-tools" id="pack-tools"></div>
    <div class="overall" id="overall"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="family-pane" style="display:none">
    <div id="fam-grid"></div>
    <div id="fam-edit" style="display:none">
      <img class="imgprev" id="fe-img" alt="" />
      <input type="file" id="fe-file" accept="image/*" style="display:none" />
      <div class="row">
        <button id="fe-pick">🖼 Pick image</button>
        <button id="fe-clearimg">✕ No image</button>
      </div>
      <input type="text" id="fe-name" placeholder="Name (e.g. Nani)" maxlength="40" />
      <input type="text" id="fe-title" placeholder="Fun title (e.g. the Cookie Queen)" maxlength="60" />
      <div class="row">
        <button id="fe-save" class="primary" style="background:#4cd964;color:#fff">✓ Save</button>
        <button id="fe-del" style="background:#ff6b6b;color:#fff">🗑 Delete</button>
        <button id="fe-cancel" style="background:#e3e0f2">Cancel</button>
      </div>
    </div>
    <div class="fam-lines" id="fam-lines"></div>
    <div class="pack-tools" id="fam-tools"></div>
  </div>

  <div class="card">
    <div class="prompt" id="prompt">…</div>
    <div class="sub" id="sub"></div>
    <div class="key-name" id="keyname"></div>
    <div class="rec-row">
      <button id="rec-btn" title="Record / stop (Space)">⏺</button>
      <div id="timer">0.0s</div>
    </div>
    <div class="post" id="post" style="display:none">
      <button id="play-btn" title="Play (P)">▶ Play</button>
      <button id="save-btn" title="Save + next (Enter)">✓ Save</button>
      <button id="redo-btn" title="Redo (R)">↺ Redo</button>
    </div>
    <div class="nav">
      <button id="prev-btn" title="←">◀ Prev</button>
      <button id="missing-btn" class="primary">Next missing ⏭</button>
      <button id="next-btn" title="→">Next ▶</button>
      <span id="pos" style="align-self:center;font-size:2.6vmin;opacity:.7"></span>
    </div>
    <div class="takes"><h3>Takes</h3><div id="takes"></div></div>
    <div id="status"></div>
  </div>
  <p class="hintline">Space = record/stop · P = play · Enter = save &amp; next · R = redo · ←/→ = navigate</p>
</div>
<audio id="player" preload="none"></audio>
<script>
'use strict';
const GROUPS = [
  ['cheer', 'Cheers'], ['try', 'Try again'], ['letter_', 'Letters'], ['phrase_', 'A is for…'],
  ['num_', 'Numbers'], ['count_', 'Counting'], ['word_', 'Words & names'],
  ['sword_', 'Spell — say'], ['sdone_', 'Spell — done'], ['find_', 'Find it!'],
  ['smash_', 'Smash'], ['', 'Other'],
];
const POOL_IDEAS = {
  cheer: ['Yay!', 'Good job Ezdan!', 'Wow, so clever!', 'High five!', 'Super star!'],
  try: ['Oops! Try again!', 'Almost!', 'You can do it!', 'One more try!'],
};
const FAMILY_LINES = [
  ['name', 'Name'], ['peekaboo', 'Peekaboo'], ['where', 'Where’s…?'], ['fun', 'Fun lines'],
];
const FAMILY_LINE_TEXT = {
  name: (m) => `${m.name}!`,
  peekaboo: (m) => `Peekaboo! It's ${m.name}!`,
  where: (m) => `Where's ${m.name}?`,
  fun: () => 'Any silly line — up to 10 takes!',
};
let view = 'voices';
let clips = [], manifest = {packs:{}, voices:{}}, voice = '', group = 'cheer', idx = 0;
let members = [], family = {members:[]}, curMember = '', curLine = 'name';
let media = null, rec = null, starting = false, chunks = [], recStart = 0, recTimer = null, autoStop = null;
let pendingBlob = null, pendingUrl = null, ac = null;
let playBtn = null; // button currently marked as playing
const $ = (s) => document.querySelector(s);
const player = $('#player');
const takes = (v, k) => ((manifest.voices || {})[v] || {})[k] || [];
const isPool = () => group === 'cheer' || group === 'try';
const clipKey = () => isPool() ? group : clips[idx].key;
const member = () => members.find((m) => m.id === curMember) || null;
const famMember = () => (family.members || []).find((m) => m.id === curMember) || null;
const memTakes = (l) => ((famMember() || {}).lines || {})[l] || [];

function groupOf(key) {
  for (const [p] of GROUPS) if (p && key.startsWith(p)) return p;
  return '';
}
function groupItems(g) {
  if (g === 'cheer' || g === 'try') return [{key: g, text: ''}];
  const [p] = GROUPS.find(([pp]) => pp === g) || [''];
  return clips.filter((c) => groupOf(c.key) === p);
}
function stopPlay() {
  player.pause();
  if (playBtn) { playBtn.classList.remove('playing'); playBtn.textContent = '▶'; playBtn = null; }
}
function playUrl(url, btn) {
  if (playBtn === btn && !player.paused) { stopPlay(); return; }
  stopPlay();
  player.src = url;
  playBtn = btn;
  if (btn) { btn.classList.add('playing'); btn.textContent = '⏸'; }
  player.play().catch(() => stopPlay());
}
player.addEventListener('ended', stopPlay);
player.addEventListener('pause', () => { if (playBtn) { playBtn.classList.remove('playing'); playBtn.textContent = '▶'; playBtn = null; } });

function setStatus(t, ok) { const s = $('#status'); s.textContent = t; s.style.color = ok ? '#1f7a3d' : '#7a1f3d'; }

// ---------- shared card (prompt / takes / nav) ----------
function drawCard({prompt, sub, keyname, pos, takeFiles, takeUrl}) {
  $('#prompt').textContent = prompt;
  $('#sub').textContent = sub;
  $('#keyname').textContent = keyname;
  $('#pos').textContent = pos;
  $('#takes').innerHTML = takeFiles.map((f) =>
    `<div class="take"><button class="play" data-f="${f}">▶</button><span class="fname">${f}</span><button class="del" data-f="${f}">🗑</button></div>`
  ).join('') || '<div style="opacity:.6">No takes yet — hit the big button!</div>';
  $('#takes').dataset.url = takeUrl;
  discardPending();
}

function draw() {
  if (view === 'voices') drawVoices(); else drawFamily();
}

function drawVoices() {
  const packs = manifest.packs || {};
  const slugs = Object.keys(packs);
  if (!voice || !packs[voice]) voice = slugs[0] || '';
  $('#tabs').innerHTML = slugs.map((s) =>
    `<button class="tab ${s === voice ? 'on' : ''}" data-v="${s}">${packs[s].name || s}</button>`).join('') +
    `<button class="tab" data-v="__new">＋ New pack</button>`;
  const hasTakes = !!(manifest.voices || {})[voice];
  $('#pack-tools').innerHTML = voice
    ? `<button id="rename-pack">✎ Rename “${packs[voice].name || voice}”</button>` +
      (hasTakes ? '' : '<button id="del-pack">🗑 Delete pack</button>')
    : '';
  $('#chips').innerHTML = GROUPS.map(([p, label]) => {
    const items = groupItems(p);
    const done = items.filter((c) => takes(voice, c.key).length).length;
    return `<button class="chip ${p === group ? 'on' : ''}" data-g="${p}">${label}<small>${done}/${items.length}</small></button>`;
  }).join('');
  let d = 0, t = 0;
  for (const [p] of GROUPS) for (const c of groupItems(p)) { t++; if (takes(voice, c.key).length) d++; }
  $('#overall').textContent = `${d} / ${t} recorded`;
  if (isPool()) {
    drawCard({
      prompt: GROUPS.find(([p]) => p === group)[1] + ' — any phrase you like!',
      sub: 'Ideas: ' + POOL_IDEAS[group].join(' · '),
      keyname: `pool: ${group} (up to 30 takes)`, pos: '',
      takeFiles: takes(voice, group), takeUrl: `/audio/voices/${voice}/`,
    });
  } else {
    const c = clips[idx];
    drawCard({
      prompt: c.text || c.key,
      sub: takes(voice, c.key).length ? `✓ ${takes(voice, c.key).length} take(s)` : '',
      keyname: c.key, pos: `${idx + 1} / ${clips.length}`,
      takeFiles: takes(voice, c.key), takeUrl: `/audio/voices/${voice}/`,
    });
  }
}

function drawFamily() {
  if (curMember && !members.find((m) => m.id === curMember)) curMember = '';
  if (!curMember && members.length) curMember = members[0].id;
  $('#fam-grid').innerHTML = members.map((m) => {
    const img = m.image ? `<img src="/family/img/${m.image}" alt="">` : `<div class="mem-avatar">${m.name[0].toUpperCase()}</div>`;
    return `<button class="mem-card ${m.id === curMember ? 'on' : ''}" data-m="${m.id}">${img}` +
      `<span class="mname">${m.name}</span><span class="mtitle">${m.title || ''}</span></button>`;
  }).join('') + `<button class="mem-card add" data-m="__add">＋<span class="mname">Add family member</span></button>`;
  const m = member();
  $('#fam-tools').innerHTML = m
    ? `<button id="edit-mem">✎ Edit “${m.name}”</button>` : '';
  $('#fam-lines').innerHTML = m ? FAMILY_LINES.map(([l, label]) => {
    const n = memTakes(l).length;
    return `<button class="chip ${l === curLine ? 'on' : ''}" data-l="${l}">${label}<small>${n}</small></button>`;
  }).join('') : '';
  if (!m) {
    drawCard({prompt: 'Add your family!', sub: 'Chibi images + their own voices → the Peekaboo game.',
      keyname: '', pos: '', takeFiles: [], takeUrl: ''});
    return;
  }
  const files = memTakes(curLine);
  drawCard({
    prompt: FAMILY_LINE_TEXT[curLine](m),
    sub: files.length ? `✓ ${files.length} take(s)` :
      (curLine !== 'fun' ? 'A Tara fallback exists — record your own to replace it!' : ''),
    keyname: `${m.id} · ${curLine} (max ${curLine === 'fun' ? 10 : 5})`,
    pos: `${FAMILY_LINES.findIndex(([l]) => l === curLine) + 1} / ${FAMILY_LINES.length}`,
    takeFiles: files, takeUrl: `/family/audio/${curMember}/`,
  });
}

// ---------- recording engine (shared) ----------
async function startRec() {
  if (rec || starting) return;
  if (view === 'family' && !member()) { setStatus('Add a family member first'); return; }
  starting = true; // set synchronously — double clicks/Space can't race the getUserMedia await
  stopPlay();
  try {
    media = await navigator.mediaDevices.getUserMedia(
      {audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  } catch (e) { setStatus('Mic blocked: ' + e.message); starting = false; return; }
  const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
    : MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
  chunks = [];
  rec = new MediaRecorder(media, mime ? {mimeType: mime} : undefined);
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = finishRec;
  rec.start();
  starting = false;
  recStart = performance.now();
  $('#rec-btn').classList.add('rec');
  $('#rec-btn').textContent = '⏹';
  $('#timer').textContent = '0.0s';
  clearInterval(recTimer); clearTimeout(autoStop);
  recTimer = setInterval(() => { $('#timer').textContent = ((performance.now() - recStart) / 1000).toFixed(1) + 's'; }, 100);
  autoStop = setTimeout(stopRec, 8000);
  setStatus('Recording…');
}
function stopRec() {
  if (!rec) return;
  clearInterval(recTimer); recTimer = null;
  clearTimeout(autoStop); autoStop = null;
  rec.stop();
}
function stopMic() { if (media) { media.getTracks().forEach((t) => t.stop()); media = null; } }
function discardPending() {
  stopPlay();
  if (pendingUrl) URL.revokeObjectURL(pendingUrl);
  pendingBlob = null; pendingUrl = null;
  $('#post').style.display = 'none';
}
async function finishRec() {
  rec = null;
  $('#rec-btn').classList.remove('rec');
  $('#rec-btn').textContent = '⏺';
  stopMic();
  const blob = new Blob(chunks, {type: chunks[0] ? chunks[0].type : 'audio/webm'});
  chunks = [];
  try {
    const wav = await processAudio(blob);
    discardPending();
    pendingBlob = wav;
    pendingUrl = URL.createObjectURL(wav);
    $('#post').style.display = 'flex';
    setStatus('Ready — play it back, then Save.');
  } catch (e) { setStatus('Could not process audio: ' + e.message); }
}
// decode -> mono -> trim silence (-45dBFS, 40ms lead / 80ms tail pad) -> peak normalize -> WAV 16-bit
async function processAudio(blob) {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ac.decodeAudioData(await blob.arrayBuffer());
  const sr = buf.sampleRate;
  const n = buf.length;
  const mono = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) mono[i] += d[i] / buf.numberOfChannels;
  }
  // silence = 20ms window RMS below -45dBFS (a per-sample peak test misses
  // quiet noise tails with sparse breath/mic bumps above -45)
  const TH2 = Math.pow(10, -45 / 10), WIN = Math.max(1, Math.round(sr * 0.02));
  const LEAD = Math.round(sr * 0.04), TAIL = Math.round(sr * 0.08);
  const loud = (i) => {
    let s = 0; const j = Math.min(n, i + WIN);
    for (let k = i; k < j; k++) s += mono[k] * mono[k];
    return s / (j - i) >= TH2;
  };
  let a = 0, b = n - 1;
  while (a < n && !loud(a)) a += WIN;
  while (b > a && !loud(Math.max(0, b - WIN))) b -= WIN;
  a = Math.max(0, a - LEAD); b = Math.min(n - 1, b + TAIL);
  if (b <= a) throw new Error('too quiet / empty take');
  const len = b - a + 1;
  const out = new Float32Array(len);
  let peak = 0;
  for (let i = 0; i < len; i++) { out[i] = mono[a + i]; if (Math.abs(out[i]) > peak) peak = Math.abs(out[i]); }
  const gain = peak > 0 ? Math.min(0.891 / peak, 8) : 1;
  for (let i = 0; i < len; i++) out[i] = Math.max(-1, Math.min(1, out[i] * gain));
  const bytes = new ArrayBuffer(44 + len * 2), dv = new DataView(bytes);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + len * 2, true); ws(8, 'WAVEfmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  ws(36, 'data'); dv.setUint32(40, len * 2, true);
  for (let i = 0; i < len; i++) dv.setInt16(44 + i * 2, Math.round(out[i] * 32767), true);
  return new Blob([bytes], {type: 'audio/wav'});
}
async function save() {
  if (!pendingBlob) return;
  const url = view === 'voices'
    ? `/api/save?voice=${voice}&clip=${encodeURIComponent(clipKey())}`
    : `/api/family/${curMember}/lines/${curLine}`;
  const r = await fetch(url, {method: 'POST', body: pendingBlob});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { setStatus('Save failed: ' + (j.error || r.status)); return; }
  if (view === 'voices') { manifest = j.manifest; } else { members = j.members; family = j.family; }
  setStatus('Saved ' + j.file, true);
  const wasPool = view === 'voices' && isPool();
  draw();
  if (!wasPool) nextMissing();
}
async function delTake(f) {
  stopPlay();
  const url = view === 'voices'
    ? `/api/take?voice=${voice}&file=${encodeURIComponent(f)}`
    : `/api/family/${curMember}/lines/${curLine}/${encodeURIComponent(f)}`;
  const r = await fetch(url, {method: 'DELETE'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { setStatus('Delete failed: ' + (j.error || r.status)); return; }
  if (view === 'voices') { manifest = j.manifest; } else { members = j.members; family = j.family; }
  draw();
}
function nav(d) {
  if (view === 'family') {
    const i = FAMILY_LINES.findIndex(([l]) => l === curLine);
    curLine = FAMILY_LINES[(i + d + FAMILY_LINES.length) % FAMILY_LINES.length][0];
    stopPlay();
    draw();
    return;
  }
  if (isPool()) group = '';
  idx = (idx + d + clips.length) % clips.length;
  group = groupOf(clips[idx].key);
  stopPlay();
  draw();
}
function nextMissing() {
  if (view === 'family') {
    for (const [l] of FAMILY_LINES) {
      if (!memTakes(l).length) { curLine = l; draw(); return; }
    }
    return;
  }
  for (let i = 0; i < clips.length; i++) {
    const j = (idx + i) % clips.length;
    if (!takes(voice, clips[j].key).length && groupOf(clips[j].key) === group) { idx = j; draw(); return; }
  }
  for (let i = 0; i < clips.length; i++) {
    const j = (idx + i) % clips.length;
    if (!takes(voice, clips[j].key).length) { idx = j; group = groupOf(clips[j].key); draw(); return; }
  }
}
async function newPack() {
  const name = prompt('Name for the new voice pack (e.g. Nani):');
  if (!name) return;
  const r = await fetch('/api/packs', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { setStatus('Could not create pack: ' + (j.error || r.status)); return; }
  manifest = j.manifest; voice = j.slug; draw();
}
async function renamePack() {
  const cur = (manifest.packs[voice] || {}).name || voice;
  const name = prompt('Rename pack:', cur);
  if (!name || name === cur) return;
  const r = await fetch(`/api/packs/${voice}`, {method: 'PATCH', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { setStatus('Rename failed: ' + (j.error || r.status)); return; }
  manifest = j.manifest; draw();
}
async function delPack() {
  if (!confirm(`Delete the empty pack “${(manifest.packs[voice] || {}).name || voice}”?`)) return;
  const r = await fetch(`/api/packs/${voice}`, {method: 'DELETE'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { setStatus('Delete failed: ' + (j.error || r.status)); return; }
  manifest = j.manifest; voice = ''; draw();
}

// ---------- family add/edit ----------
let feImage = null; // base64 for the edit form
function openEdit(m) {
  feImage = null;
  $('#fam-edit').style.display = 'flex';
  $('#fe-name').value = m ? m.name : '';
  $('#fe-title').value = m ? (m.title || '') : '';
  $('#fe-img').src = m && m.image ? `/family/img/${m.image}` : '';
  $('#fe-img').style.display = m && m.image ? '' : 'none';
  $('#fe-del').style.display = m ? '' : 'none';
  $('#fe-save').dataset.id = m ? m.id : '';
}
function closeEdit() { $('#fam-edit').style.display = 'none'; feImage = null; }
async function saveMember() {
  const id = $('#fe-save').dataset.id;
  const body = {name: $('#fe-name').value.trim(), title: $('#fe-title').value.trim()};
  if (feImage) body.image = feImage;
  const r = await fetch(id ? `/api/family/${id}` : '/api/family', {
    method: id ? 'PATCH' : 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { setStatus('Save failed: ' + (j.error || r.status)); return; }
  members = j.members; family = j.family;
  curMember = j.member.id;
  closeEdit(); draw();
}
async function delMember() {
  const id = $('#fe-save').dataset.id;
  const m = members.find((x) => x.id === id);
  if (!m || !confirm(`Delete ${m.name} and all their files?`)) return;
  const r = await fetch(`/api/family/${id}`, {method: 'DELETE'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { setStatus('Delete failed: ' + (j.error || r.status)); return; }
  members = j.members; family = j.family; curMember = '';
  closeEdit(); draw();
}
$('#fe-pick').addEventListener('click', () => $('#fe-file').click());
$('#fe-file').addEventListener('change', () => {
  const f = $('#fe-file').files[0];
  if (!f) return;
  if (f.size > 8 * 1024 * 1024) { setStatus('Image too big (max 8 MB)'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    feImage = rd.result.split(',')[1];
    $('#fe-img').src = rd.result;
    $('#fe-img').style.display = '';
  };
  rd.readAsDataURL(f);
});
$('#fe-clearimg').addEventListener('click', () => { feImage = null; $('#fe-img').style.display = 'none'; });
$('#fe-save').addEventListener('click', saveMember);
$('#fe-del').addEventListener('click', delMember);
$('#fe-cancel').addEventListener('click', closeEdit);

// ---------- wiring ----------
document.querySelectorAll('.top-tab').forEach((b) => b.addEventListener('click', (e) => {
  e.target.blur();
  view = e.target.dataset.view;
  document.querySelectorAll('.top-tab').forEach((x) => x.classList.toggle('on', x === b));
  $('#voices-pane').style.display = view === 'voices' ? '' : 'none';
  $('#family-pane').style.display = view === 'family' ? '' : 'none';
  stopPlay(); discardPending();
  draw();
}));
$('#tabs').addEventListener('click', (e) => {
  const v = e.target.dataset.v; if (!v) return;
  e.target.blur();
  if (v === '__new') newPack(); else { voice = v; draw(); }
});
$('#pack-tools').addEventListener('click', (e) => {
  if (e.target.id === 'rename-pack') renamePack();
  else if (e.target.id === 'del-pack') delPack();
});
$('#chips').addEventListener('click', (e) => {
  const g = e.target.closest('.chip'); if (!g) return;
  e.target.blur();
  group = g.dataset.g;
  if (!isPool()) { const first = groupItems(group)[0]; idx = clips.findIndex((c) => c.key === first.key); }
  draw();
});
$('#fam-grid').addEventListener('click', (e) => {
  const card = e.target.closest('.mem-card'); if (!card) return;
  e.target.blur && e.target.blur();
  if (card.dataset.m === '__add') { openEdit(null); return; }
  if (card.dataset.m === curMember && !$('#fam-edit').style.display) closeEdit();
  curMember = card.dataset.m;
  draw();
});
$('#fam-tools').addEventListener('click', (e) => {
  if (e.target.id === 'edit-mem') openEdit(member());
});
$('#fam-lines').addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (!c) return;
  e.target.blur();
  curLine = c.dataset.l;
  draw();
});
$('#rec-btn').addEventListener('click', (e) => { e.target.blur(); rec ? stopRec() : startRec(); });
$('#play-btn').addEventListener('click', (e) => { e.target.blur(); if (pendingUrl) playUrl(pendingUrl, e.target); });
$('#save-btn').addEventListener('click', save);
$('#redo-btn').addEventListener('click', discardPending);
$('#prev-btn').addEventListener('click', () => nav(-1));
$('#next-btn').addEventListener('click', () => nav(1));
$('#missing-btn').addEventListener('click', nextMissing);
$('#takes').addEventListener('click', (e) => {
  const f = e.target.dataset.f; if (!f) return;
  e.target.blur();
  if (e.target.classList.contains('play')) playUrl($('#takes').dataset.url + f, e.target);
  else if (e.target.classList.contains('del') && confirm('Delete ' + f + '?')) delTake(f);
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); rec ? stopRec() : startRec(); }
  else if (e.key === 'p' || e.key === 'P') { if (pendingUrl) playUrl(pendingUrl, $('#play-btn')); }
  else if (e.key === 'Enter') { if ($('#fam-edit').style.display === 'none') save(); }
  else if (e.key === 'r' || e.key === 'R') discardPending();
  else if (e.key === 'ArrowLeft') nav(-1);
  else if (e.key === 'ArrowRight') nav(1);
});
function shutdownAudio() { stopPlay(); if (rec) stopRec(); else stopMic(); }
window.addEventListener('pagehide', shutdownAudio);
document.addEventListener('visibilitychange', () => { if (document.hidden) shutdownAudio(); });

(async () => {
  const r = await fetch('/api/clips');
  const j = await r.json();
  clips = j.clips; manifest = j.manifest;
  const fr = await fetch('/api/family');
  const fj = await fr.json().catch(() => ({}));
  members = fj.members || []; family = fj.family || {members: []};
  draw();
})();
</script>
</body>
</html>
