<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AB12" />
  <meta name="theme-color" content="#ff5c8a" />
  <title>AB12</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="clouds">
      <span>☁️</span><span>☁️</span><span>☁️</span>
      <span class="deco">🎈</span><span class="deco">⭐</span><span class="deco">🌈</span><span class="deco">🎈</span><span class="deco">✨</span>
    </div>
    <h1 class="title"><span>A</span><span>B</span><span>1</span><span>2</span></h1>
    <div id="home-view" class="home-view"></div>
    <p class="hint">Desktop: type on the keyboard · Phone: tap the big buttons<br/>Hold the ⭐ in the corner for 2 seconds to come back here</p>
    <p class="made-by">Made for Ezdan with love from Daddy Atif Ali ❤️</p>
    <button id="settings-btn" class="settings-btn" aria-label="Open settings">⚙️<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/></svg></button>
  </section>

  <!-- SETTINGS (sections built by src/core/settingsPanel.js) -->
  <div id="settings" class="settings" hidden>
    <div class="settings-card">
      <h2>Settings</h2>
    </div>
  </div>

  <!-- MODE SCREENS (each mode builds its own markup on first entry) -->
  <section id="learn" class="screen"></section>
  <section id="smash" class="screen"></section>
  <section id="find" class="screen"></section>
  <section id="spell" class="screen"></section>
  <section id="peekaboo" class="screen"></section>
  <section id="wordmonsters" class="screen"></section>
  <section id="animalfarm" class="screen"></section>
  <section id="sortit" class="screen"></section>
  <section id="feed" class="screen"></section>
  <section id="puzzle" class="screen"></section>
  <section id="buildgo" class="screen"></section>

  <button id="home-btn" class="home-btn" aria-label="Hold to go home">⭐<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/></svg></button>
  <div id="unlock-toast" class="toast">Hold ⭐ to go home</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
