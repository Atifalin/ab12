<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AB12" />
  <meta name="theme-color" content="#ff5c8a" />
  <title>AB12 — Fun Toddler Learning Games: ABCs, 123s, Phonics, Puzzles &amp; Animals</title>
  <meta name="description" content="AB12 is an ad-free, interactive toddler and preschool learning web app featuring Letters &amp; Numbers, Phonics Word Monsters, Spell It, Animal Playground, Picture Puzzles, Build &amp; Go Vehicles, Sort It, Feed the Monster, and Family Peekaboo." />
  <meta name="keywords" content="toddler games, ABC learning game, kids phonics app, toddler puzzles, animal sounds game, preschool educational games, interactive alphabet, AB12" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://ab12.ezypath.in/" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AB12 Kids Learning" />
  <meta property="og:url" content="https://ab12.ezypath.in/" />
  <meta property="og:title" content="AB12 — Joyful Toddler Learning Games (ABCs, 123s, Puzzles &amp; Phonics)" />
  <meta property="og:description" content="11 interactive learning games built for toddlers &amp; preschoolers: Letters &amp; Numbers, Word Monsters, Spell It, Animal Playground, Picture Puzzles, Build &amp; Go, Feed the Monster &amp; more!" />
  <meta property="og:image" content="https://ab12.ezypath.in/og-card.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AB12 — Joyful Toddler Learning Games" />
  <meta name="twitter:description" content="11 interactive toddler learning games: ABCs, 123s, Phonics, Picture Puzzles, Animal Playground, Build &amp; Go &amp; more." />
  <meta name="twitter:image" content="https://ab12.ezypath.in/og-card.svg" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["WebApplication", "LearningResource"],
    "name": "AB12 Toddler Learning Games",
    "url": "https://ab12.ezypath.in/",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "iOS, Android, macOS, Windows, Web",
    "educationalLevel": "Preschool, Toddler",
    "typicalAgeRange": "1-5",
    "description": "Interactive toddler learning app with 11 playful modes including ABCs & 123s, Word Monsters phonics, Spell It, Picture Puzzles, Build & Go vehicles, Sort It, Feed the Monster, Animal Playground, and Peekaboo.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="clouds">
      <span>☁️</span><span>☁️</span><span>☁️</span>
      <span class="deco">🎈</span><span class="deco">⭐</span><span class="deco">🌈</span><span class="deco">🎈</span><span class="deco">✨</span>
    </div>
    <h1 class="title"><span>A</span><span>B</span><span>1</span><span>2</span></h1>
    <div id="home-view" class="home-view"></div>
    <p class="hint">Desktop: type on the keyboard · Phone: tap the big buttons<br/>Hold the ⭐ in the corner for 2 seconds to come back here</p>
    <p class="made-by">Made for Ezdan with love from Daddy Atif Ali ❤️</p>
    <button id="settings-btn" class="settings-btn" aria-label="Open settings">⚙️<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/></svg></button>
  </section>

  <!-- SETTINGS (sections built by src/core/settingsPanel.js) -->
  <div id="settings" class="settings" hidden>
    <div class="settings-card">
      <h2>Settings</h2>
    </div>
  </div>

  <!-- MODE SCREENS (each mode builds its own markup on first entry) -->
  <section id="learn" class="screen"></section>
  <section id="smash" class="screen"></section>
  <section id="find" class="screen"></section>
  <section id="spell" class="screen"></section>
  <section id="peekaboo" class="screen"></section>
  <section id="wordmonsters" class="screen"></section>
  <section id="animalfarm" class="screen"></section>
  <section id="sortit" class="screen"></section>
  <section id="feed" class="screen"></section>
  <section id="puzzle" class="screen"></section>
  <section id="buildgo" class="screen"></section>
  <section id="pokelab" class="screen"></section>

  <button id="home-btn" class="home-btn" aria-label="Hold to go home">⭐<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/></svg></button>
  <div id="unlock-toast" class="toast">Hold ⭐ to go home</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
